name: Publish
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

# Required for pub.dev's OIDC-based automated publishing (no long-lived token
# stored in this repo) — see RELEASING.md for the one-time pub.dev-side setup
# this depends on.
permissions:
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter pub publish -f
