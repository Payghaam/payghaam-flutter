name: Publish
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

# Required for pub.dev's OIDC-based automated publishing (no long-lived token
# stored in this repo) — see RELEASING.md for the one-time pub.dev-side setup
# this depends on.
permissions:
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Check formatting
        run: dart format --set-exit-if-changed lib test example bin cli
      - run: flutter analyze
      - run: flutter test
      - run: flutter pub publish --dry-run
      # This is the step that actually performs pub.dev's OIDC credential
      # exchange (using the id-token: write permission above). Just having a
      # Dart SDK present via flutter-action isn't enough — without this,
      # `flutter pub publish` has no registered credential and falls back to
      # the old interactive browser OAuth flow, which hangs forever in CI.
      # dart-lang/setup-dart shares the same PUB_CACHE credentials store as
      # Flutter's bundled pub client, so the credential it registers here is
      # what `flutter pub publish` below picks up.
      - uses: dart-lang/setup-dart@v1
      - run: flutter pub publish -f
