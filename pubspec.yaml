name: engagekaro_flutter
description: EngageKaro Flutter SDK — identify users, manage subscriptions, set tags, and track events with the EngageKaro engagement platform.
version: 0.1.0
homepage: https://github.com/your-org/engagekaro
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      # iOS ships native APNs (no Firebase). Android ships native FCM (depends on
      # the firebase-messaging Android library directly — the host app does NOT
      # need the firebase_messaging Flutter plugin). One package, no platform branch.
      ios:
        pluginClass: EngagekaroFlutterPlugin
      android:
        package: com.engagekaro.engagekaro_flutter
        pluginClass: EngagekaroFlutterPlugin
