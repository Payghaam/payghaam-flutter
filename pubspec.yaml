name: payghaam_flutter
description: Payghaam Flutter SDK — identify users, manage subscriptions, set tags, and track events with the Payghaam engagement platform.
version: 0.1.0
homepage: https://github.com/msamoeed/engagekaro
repository: https://github.com/msamoeed/engagekaro
issue_tracker: https://github.com/msamoeed/engagekaro/issues

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      # iOS ships native APNs (no Firebase). Android ships native FCM (depends on
      # the firebase-messaging Android library directly — the host app does NOT
      # need the firebase_messaging Flutter plugin). One package, no platform branch.
      ios:
        pluginClass: PayghaamFlutterPlugin
      android:
        package: com.payghaam.payghaam_flutter
        pluginClass: PayghaamFlutterPlugin
      web:
        pluginClass: PayghaamFlutterPlugin
        fileName: payghaam_flutter_web.dart
      linux:
        dartPluginClass: PayghaamFlutterPlugin
        fileName: payghaam_flutter_stub.dart
      macos:
        dartPluginClass: PayghaamFlutterPlugin
        fileName: payghaam_flutter_stub.dart
      windows:
        dartPluginClass: PayghaamFlutterPlugin
        fileName: payghaam_flutter_stub.dart
