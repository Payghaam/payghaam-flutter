include: package:flutter_lints/flutter.yaml

# Flutter 3.47+ AnalysisOptionsMigration appends these on every
# `flutter pub get` when missing — leaving the tree dirty and failing
# `pub publish --dry-run` in CI. Commit the migrated state.
analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    public_member_api_docs: false
