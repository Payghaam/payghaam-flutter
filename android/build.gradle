group 'com.payghaam.payghaam_flutter'
version '0.1.0'

buildscript {
    ext.kotlin_version = '1.9.0'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.payghaam.payghaam_flutter'
    compileSdk 34

    defaultConfig {
        minSdk 21
    }

    compileOptions {
        // Must match sdks/android's JVM target (17) now that this plugin depends on
        // it directly — a lower target here can't consume classes compiled for a
        // higher one.
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Canonical native SDK, published to Maven Central as com.payghaam:payghaam.
    // Brings in firebase-messaging and kotlinx-coroutines-android transitively, so
    // this plugin no longer declares them directly.
    implementation "com.payghaam:payghaam"
    implementation 'androidx.core:core-ktx:1.13.1'
}
